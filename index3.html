<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Rodrigo Gatica Abraham</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* CONFIGURACIÓN DEL FONDO CON TU FOTO DE LUCES ROJAS */
        body.index3 {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('imagen1.jpeg') no-repeat center center fixed !important;
            background-size: cover !important;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* NAVEGACIÓN A LA DERECHA */
        .main-nav {
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            gap: 20px;
        }
        .main-nav a { 
            color: white; 
            text-decoration: none; 
            font-weight: bold; 
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        h1, h2 { text-align: center !important; width: 100%; margin: 10px 0; }

        /* CONTENEDOR DEL FORMULARIO Y REDES */
        .contact-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .contact-form {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #8b0000;
            margin-bottom: 30px;
        }

        .contact-form input, 
        .contact-form select, 
        .contact-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box; /* Evita que se salgan del cuadro */
        }

        .contact-form label {
            display: block;
            margin-bottom: 5px;
            color: #bbb;
            font-size: 0.9rem;
        }

        .contact-form button {
            width: 100%;
            padding: 15px;
            background: #8b0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .contact-form button:hover { background: #ff0000; }

        /* SECCIÓN DE REDES SOCIALES */
        .redes {
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        .redes ul { list-style: none; padding: 0; margin: 0; }
        
        .redes li { 
            display: flex; 
            align-items: center; 
            margin-bottom: 15px;
            gap: 15px;
        }

        /* ICONOS CLAVADOS EN 24PX */
        .redes img {
            width: 24px !important;
            height: 24px !important;
            object-fit: contain !important;
        }

        .redes a { 
            color: #eee; 
            text-decoration: none; 
            font-size: 1.05rem;
            transition: 0.3s;
        }

        .redes a:hover { color: #8b0000; }
    </style>
</head>
<body class="index3">

    <nav class="main-nav">
        <a href="index.html">Inicio</a>
        <a href="index2.html">Historia</a>
    </nav>

    <h1>Contacto</h1>
    <h2>Llevemos la música al siguiente nivel</h2>

    <main class="contact-container">
        <section class="contact-form">
            <form action="https://formsubmit.co/aa0abb814ae1df5308291f25ffee0303" method="POST">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="https://eclectic-melba-f07fde.netlify.app/index3.html">
                
                <input type="text" name="name" placeholder="Tu nombre o nombre de banda" required>
                <input type="email" name="email" placeholder="Tu correo electrónico" required>

                <label for="motivo">¿Cuál es el motivo de tu mensaje?</label>
                <select name="motivo" id="motivo" required>
                    <option value="" disabled selected>Seleccioná una opción...</option>
                    <option value="Sugerencia de Vocal Cover">Sugerir un Vocal Cover</option>
                    <option value="Grabación de voces">Contratarme para grabar voces</option>
                    <option value="Colaboración">Propuesta de Colaboración</option>
                    <option value="Manager/Sello Discográfico">Manager o Sello Discográfico</option>
                    <option value="Otro">Otro asunto</option>
                </select>

                <textarea name="message" rows="5" placeholder="Escribí los detalles aquí..." required></textarea>
                
                <button type="submit">ENVIAR PROPUESTA</button>
            </form>
        </section>

        <section class="redes">
            <ul>
                <li>
                    <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube">
                    <a href="https://www.youtube.com/@gat30" target="_blank">Canal de YouTube</a>
                </li>
                <li>
                    <img src="https://cdn-icons-png.flaticon.com/512/1384/1384063.png" alt="Instagram">
                    <a href="https://www.instagram.com/p/DEvrUvhPXlQ/?hl=es&img_index=1" target="_blank">Instagram</a>
                </li>
                <li>
                    <img src="https://cdn-icons-png.flaticon.com/512/1384/1384053.png" alt="Facebook">
                    <a href="https://www.facebook.com/rodrigo.gatica.399" target="_blank">Facebook Personal</a>
                </li>
                <li>
                    <img src="https://cdn-icons-png.flaticon.com/512/1384/1384053.png" alt="Facebook Page">
                    <a href="https://www.facebook.com/rodrigo322gatica" target="_blank">Página de Facebook</a>
                </li>
                <li>
                    <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Gmail">
                    <a href="https://mail.google.com/mail/u/0/?tab=rm&ogbl#inbox">Gmail</a>
                </li>
            </ul>
        </section>
    </main>

    <footer style="text-align: center; padding: 40px; opacity: 0.6; font-size: 0.8rem;">
        <p>© 2026 . Rodrigo Gatica Abraham . Vocalista</p>
    </footer>

</body>
</html>
